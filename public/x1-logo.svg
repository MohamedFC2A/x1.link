<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Obsidian Matte Glass Gradient -->
    <radialGradient id="chassisGrad" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="45%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Diamond Brilliant White Gradient (Primary Blade) -->
    <linearGradient id="bladeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>

    <!-- Liquid Titanium Metallic Gradient (Secondary Blade) -->
    <linearGradient id="bladeRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Hyper-Contrast Center Vertex Gradient -->
    <linearGradient id="vertexGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>

    <!-- Precision Laser Hairline Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Luxurious Frosted Squircle Frame -->
  <rect x="5" y="5" width="118" height="118" rx="30" fill="url(#chassisGrad)" stroke="url(#rimGrad)" stroke-width="1.5" />
  
  <!-- Subtle Internal Specular Horizon -->
  <rect x="7" y="7" width="114" height="114" rx="28" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />

  <!-- Iconic Monolithic 'M' Emblem (Stealth Quantum Geometry) -->
  <g>
    <!-- Left Ascending Monolith Blade -->
    <polygon points="26,94 40,94 40,46 56,76 64,76 38,28 26,28" fill="url(#bladeLeft)" />

    <!-- Right Ascending Monolith Blade -->
    <polygon points="102,94 88,94 88,46 72,76 64,76 90,28 102,28" fill="url(#bladeRight)" />

    <!-- Central Floating Diamond Nexus (The Core Intelligence Apex) -->
    <polygon points="64,48 72,62 64,76 56,62" fill="url(#vertexGrad)" opacity="0.95" />

    <!-- Bottom Anchor Accent Line -->
    <rect x="58" y="86" width="12" height="3" rx="1.5" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Optical Micro Balance Flares -->
  <circle cx="104" cy="22" r="2" fill="#ffffff" opacity="0.85" />
  <circle cx="24" cy="106" r="1.5" fill="#ffffff" opacity="0.3" />
</svg>
