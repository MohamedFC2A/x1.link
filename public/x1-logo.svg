<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0812"/>
      <stop offset="60%" stop-color="#140408"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#e11d48" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Subtle Cyber Tech Corners -->
  <path d="M 12 28 L 12 12 L 28 12" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 108 28 L 108 12 L 92 12" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 12 92 L 12 108 L 28 108" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 108 92 L 108 108 L 92 108" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Glowing X1 Emblem Geometry -->
  <g filter="url(#neonGlow)">
    <!-- Stylized Futuristic 'X' -->
    <path d="M 28 34 L 52 60 L 28 86" stroke="url(#glowGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 64 34 L 40 60 L 64 86" stroke="url(#glowGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stylized Futuristic '1' with Singularity Accent -->
    <path d="M 76 44 L 86 34 L 86 86" stroke="url(#textGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="74" y1="86" x2="98" y2="86" stroke="url(#textGrad)" stroke-width="7.5" stroke-linecap="round"/>
  </g>

  <!-- Central Glowing Pulse Dot -->
  <circle cx="46" cy="60" r="3.5" fill="#ffffff" />
</svg>
